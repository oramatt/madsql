name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bundle_mode:
        description: "Nuitka packaging mode"
        required: true
        default: "onefile"
        type: choice
        options:
          - onefile
          - standalone

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: madsql
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            python_arch: x64
            binary_name: madsql
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            python_arch: arm64
            binary_name: madsql
            archive_ext: tar.gz
          - runner: windows-2025
            target: windows-x86_64
            python_arch: x64
            binary_name: madsql.exe
            archive_ext: zip
          - runner: windows-11-arm
            target: windows-arm64
            python_arch: arm64
            binary_name: madsql.exe
            archive_ext: zip
          - runner: macos-15-intel
            target: macos-x86_64
            python_arch: x64
            binary_name: madsql
            archive_ext: tar.gz
          - runner: macos-15
            target: macos-arm64
            python_arch: arm64
            binary_name: madsql
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}
          cache: pip

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          requested_mode="${{ github.event.inputs.bundle_mode }}"

          if [[ -n "${requested_mode}" ]]; then
            build_mode="${requested_mode}"
          else
            build_mode="onefile"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="manual-${GITHUB_RUN_NUMBER}"
          fi
          archive_name="${APP_NAME}-${release_tag}-${{ matrix.target }}-nuitka-${build_mode}"
          echo "build_mode=${build_mode}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${archive_name}" >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install . Nuitka zstandard
          python -m nuitka --version

      - name: Build Nuitka binary
        shell: bash
        run: |
          build_dir="build/nuitka/${{ matrix.target }}"
          mkdir -p "${build_dir}"

          nuitka_args=(
            --assume-yes-for-downloads
            --output-dir="${build_dir}"
            --output-filename="${{ matrix.binary_name }}"
            --python-flag=safe_path
          )

          if [[ "${{ steps.meta.outputs.build_mode }}" == "standalone" ]]; then
            nuitka_args+=(--mode=standalone)
          else
            nuitka_args+=(--mode=onefile)
          fi

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            nuitka_args+=(--msvc=latest)
          fi

          python -m nuitka "${nuitka_args[@]}" src/madsql/__main__.py

      - name: Resolve bundle paths
        id: bundle
        shell: bash
        run: |
          build_dir="build/nuitka/${{ matrix.target }}"

          if [[ "${{ steps.meta.outputs.build_mode }}" == "standalone" ]]; then
            bundle_path="$(find "${build_dir}" -maxdepth 1 -type d -name '*.dist' | head -n 1)"
          else
            bundle_path="$(find "${build_dir}" -maxdepth 1 -type f \( -name "${{ matrix.binary_name }}" -o -name "${APP_NAME}" -o -name "${APP_NAME}.bin" -o -name "${APP_NAME}.exe" \) | head -n 1)"
          fi

          [[ -n "${bundle_path}" ]] || {
            printf 'No Nuitka bundle found in %s\n' "${build_dir}" >&2
            exit 1
          }

          if [[ "${{ steps.meta.outputs.build_mode }}" == "standalone" ]]; then
            executable_path="$(find "${bundle_path}" -maxdepth 1 -type f \( -name "${{ matrix.binary_name }}" -o -name "${APP_NAME}" -o -name "${APP_NAME}.bin" -o -name "${APP_NAME}.exe" \) | head -n 1)"
          else
            executable_path="${bundle_path}"
          fi

          [[ -n "${executable_path}" ]] || {
            printf 'No executable found in %s\n' "${bundle_path}" >&2
            exit 1
          }

          echo "bundle_path=${bundle_path}" >> "${GITHUB_OUTPUT}"
          echo "executable_path=${executable_path}" >> "${GITHUB_OUTPUT}"

      - name: Smoke test binary
        shell: bash
        run: |
          "${{ steps.bundle.outputs.executable_path }}" --version
          "${{ steps.bundle.outputs.executable_path }}" dialects >/dev/null

      - name: Archive binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle_path="${{ steps.bundle.outputs.bundle_path }}"
          tar -C "$(dirname "${bundle_path}")" -czf "${RUNNER_TEMP}/${{ steps.meta.outputs.archive_name }}.tar.gz" "$(basename "${bundle_path}")"
          shasum -a 256 "${RUNNER_TEMP}/${{ steps.meta.outputs.archive_name }}.tar.gz" > "${RUNNER_TEMP}/${{ steps.meta.outputs.archive_name }}.tar.gz.sha256"

      - name: Archive binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bundle_path="${{ steps.bundle.outputs.bundle_path }}"
          tar -a -C "$(dirname "${bundle_path}")" -cf "${RUNNER_TEMP}/${{ steps.meta.outputs.archive_name }}.zip" "$(basename "${bundle_path}")"
          sha256sum "${RUNNER_TEMP}/${{ steps.meta.outputs.archive_name }}.zip" > "${RUNNER_TEMP}/${{ steps.meta.outputs.archive_name }}.zip.sha256"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.archive_name }}
          path: |
            ${{ runner.temp }}/${{ steps.meta.outputs.archive_name }}.${{ matrix.archive_ext }}
            ${{ runner.temp }}/${{ steps.meta.outputs.archive_name }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish archive to GitHub release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive_path="${RUNNER_TEMP}/${{ steps.meta.outputs.archive_name }}.${{ matrix.archive_ext }}"
          checksum_path="${archive_path}.sha256"

          for _ in 1 2 3; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              break
            fi
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes >/dev/null 2>&1 || true
            sleep 2
          done

          gh release upload "${GITHUB_REF_NAME}" "$archive_path" "$checksum_path" --clobber
